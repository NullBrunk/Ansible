- name: Install docker
  hosts: servers
  become_method: sudo
  become: true
  gather_facts: no

  tasks:
    - name: Install ca-certificates and curl
      apt:
        name:
          - ca-certificates
          - curl
        update_cache: yes

    - name: Install docker repository
      shell: |
        curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
        bash -c 'echo -e "Types: deb\nURIs: https://download.docker.com/linux/debian\nSuites: $(. /etc/os-release && echo "$VERSION_CODENAME")\nComponents: stable\nSigned-By: /etc/apt/keyrings/docker.asc" > /etc/apt/sources.list.d/docker.sources'

    - name: Install docker
      apt: 
        name:
          - docker-ce 
          - docker-ce-cli 
          - containerd.io 
          - docker-buildx-plugin 
          - docker-compose-plugin
        update_cache: yes

    - name: Add admin user to docker group
      shell: usermod -aG docker {{ ansible_user }}
