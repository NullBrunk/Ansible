- name: Install ssh keys
  hosts: servers
  gather_facts: no

  vars:
    ansible_ssh_private_key_file: ~/.ssh/id_rsa.pem
    ansible_user: admin

  tasks:
    - name: Copy authorized_keys on remote host
      copy:
        src: "{{ playbook_dir }}/files/authorized_keys"
        dest: "/home/{{ ansible_user }}/.ssh/authorized_keys"

