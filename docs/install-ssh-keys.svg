<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 350" width="1000" height="350" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>install_ssh_keys: the same list of access keys is copied to every server</title>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <g id="i-key" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-7" cy="0" r="6"/><path d="M-1 0H12M8 0V5M12 0V5"/>
    </g>
    <g id="i-person" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-5" r="5"/><path d="M-10 12a10 10 0 0 1 20 0"/>
    </g>
    <g id="i-gear" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="4"/><path d="M0 -11V-7M0 7V11M-11 0H-7M7 0H11M-8 -8L-5 -5M5 5L8 8M-8 8L-5 5M5 -5L8 -8"/>
    </g>
    <g id="i-server">
      <rect x="-12" y="-11" width="24" height="6" rx="1.5"/><rect x="-12" y="-3" width="24" height="6" rx="1.5"/><rect x="-12" y="5" width="24" height="6" rx="1.5"/>
    </g>
  </defs>

  <rect width="1000" height="350" rx="18" fill="#F8FAFC"/>

  <!-- The list -->
  <rect x="30" y="30" width="300" height="200" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="50" y="60" font-size="16" font-weight="700" fill="#0F172A">The key list</text>
  <text x="50" y="78" font-size="11" fill="#64748B">One digital key per person or tool</text>

  <rect x="50" y="94" width="260" height="36" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <circle cx="74" cy="112" r="13" fill="#2563EB"/>
  <use xlink:href="#i-person" transform="translate(74,112) scale(0.65)" stroke="#FFFFFF" stroke-width="2.4"/>
  <text x="98" y="117" font-size="13" font-weight="600" fill="#1D4ED8">Team member</text>

  <rect x="50" y="136" width="260" height="36" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <circle cx="74" cy="154" r="13" fill="#2563EB"/>
  <use xlink:href="#i-person" transform="translate(74,154) scale(0.65)" stroke="#FFFFFF" stroke-width="2.4"/>
  <text x="98" y="159" font-size="13" font-weight="600" fill="#1D4ED8">Team member</text>

  <rect x="50" y="178" width="260" height="36" rx="8" fill="#FFF7ED" stroke="#FED7AA"/>
  <circle cx="74" cy="196" r="13" fill="#EA580C"/>
  <use xlink:href="#i-gear" transform="translate(74,196) scale(0.7)" stroke="#FFFFFF" stroke-width="2.2"/>
  <text x="98" y="201" font-size="13" font-weight="600" fill="#C2410C">A tool or automation</text>

  <!-- Copy -->
  <path d="M334 130H396" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
  <rect x="400" y="86" width="200" height="88" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="428" cy="114" r="13" fill="#EE0000"/>
  <text x="428" y="119.5" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">A</text>
  <text x="450" y="119" font-size="15" font-weight="700" fill="#0F172A">Ansible</text>
  <text x="416" y="148" font-size="12" fill="#64748B">Copies the list to</text>
  <text x="416" y="165" font-size="12" fill="#64748B">every server</text>
  <path d="M604 130H666" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>

  <!-- Servers -->
  <rect x="670" y="30" width="300" height="200" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="690" y="60" font-size="16" font-weight="700" fill="#0F172A">Your servers</text>
  <text x="690" y="78" font-size="11" fill="#64748B">Each one gets the same list</text>

  <rect x="690" y="94" width="260" height="56" rx="10" fill="#F1F5F9" stroke="#E2E8F0"/>
  <use xlink:href="#i-server" transform="translate(722,122) scale(1.2)" fill="#94A3B8"/>
  <text x="754" y="119" font-size="13" font-weight="700" fill="#0F172A">Server A</text>
  <text x="754" y="137" font-size="11.5" fill="#64748B">Recognises everyone on the list</text>

  <rect x="690" y="160" width="260" height="56" rx="10" fill="#F1F5F9" stroke="#E2E8F0"/>
  <use xlink:href="#i-server" transform="translate(722,188) scale(1.2)" fill="#94A3B8"/>
  <text x="754" y="185" font-size="13" font-weight="700" fill="#0F172A">Server B</text>
  <text x="754" y="203" font-size="11.5" fill="#64748B">Recognises everyone on the list</text>

  <!-- Notes -->
  <rect x="30" y="258" width="470" height="76" rx="12" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="48" y="282" font-size="12.5" font-weight="700" fill="#92400E">Careful</text>
  <text x="48" y="302" font-size="12.5" fill="#92400E">The server's old list is replaced by yours.</text>
  <text x="48" y="320" font-size="12.5" fill="#92400E">Keep your own key in it, or you lose access.</text>

  <rect x="530" y="258" width="440" height="76" rx="12" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="548" y="282" font-size="12.5" font-weight="700" fill="#166534">Result</text>
  <text x="548" y="302" font-size="12.5" fill="#166534">Everyone on the list can log in with their own key.</text>
  <text x="548" y="320" font-size="12.5" fill="#166534">To add someone: add their key and run it again.</text>
</svg>
