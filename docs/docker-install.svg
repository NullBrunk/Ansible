<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 380" width="1000" height="380" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>docker_install: the server gets Docker, a toolbox to run apps</title>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <g id="i-box" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -12L11 -6V6L0 12L-11 6V-6ZM0 0V12M0 0L-11 -6M0 0L11 -6"/>
    </g>
    <g id="i-download" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -11V5M-7 -2L0 5L7 -2M-11 11H11"/>
    </g>
    <g id="i-person" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-5" r="5"/><path d="M-10 12a10 10 0 0 1 20 0"/>
    </g>
  </defs>

  <rect width="1000" height="380" rx="18" fill="#F8FAFC"/>

  <!-- Explanation -->
  <rect x="30" y="24" width="940" height="62" rx="12" fill="#FFF7ED" stroke="#FED7AA"/>
  <circle cx="68" cy="55" r="20" fill="#EA580C"/>
  <use xlink:href="#i-box" transform="translate(68,55) scale(0.9)" stroke="#FFFFFF" stroke-width="2.2"/>
  <text x="100" y="50" font-size="13.5" font-weight="700" fill="#9A3412">What is Docker?</text>
  <text x="100" y="70" font-size="13" fill="#9A3412">A toolbox that runs apps in neat, self-contained boxes called containers.</text>

  <!-- Steps -->
  <g>
    <rect x="30" y="108" width="280" height="140" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="68" cy="144" r="22" fill="#2563EB"/>
    <use xlink:href="#i-download" transform="translate(68,144)" stroke="#FFFFFF" stroke-width="2.2"/>
    <text x="102" y="140" font-size="11" font-weight="700" fill="#64748B">STEP 1</text>
    <text x="102" y="158" font-size="14.5" font-weight="700" fill="#0F172A">Add the official source</text>
    <text x="50" y="204" font-size="12.5" fill="#475569">Tells the server where to download</text>
    <text x="50" y="224" font-size="12.5" fill="#475569">genuine, up-to-date Docker packages.</text>

    <rect x="360" y="108" width="280" height="140" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="398" cy="144" r="22" fill="#EA580C"/>
    <use xlink:href="#i-box" transform="translate(398,144)" stroke="#FFFFFF" stroke-width="2.2"/>
    <text x="432" y="140" font-size="11" font-weight="700" fill="#64748B">STEP 2</text>
    <text x="432" y="158" font-size="14.5" font-weight="700" fill="#0F172A">Install Docker</text>
    <text x="380" y="204" font-size="12.5" fill="#475569">Installs Docker and Docker Compose,</text>
    <text x="380" y="224" font-size="12.5" fill="#475569">the tools that run your apps.</text>

    <rect x="690" y="108" width="280" height="140" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="728" cy="144" r="22" fill="#7C3AED"/>
    <use xlink:href="#i-person" transform="translate(728,144)" stroke="#FFFFFF" stroke-width="2.2"/>
    <text x="762" y="140" font-size="11" font-weight="700" fill="#64748B">STEP 3</text>
    <text x="762" y="158" font-size="14.5" font-weight="700" fill="#0F172A">Allow your admin</text>
    <text x="710" y="204" font-size="12.5" fill="#475569">Lets the admin user run Docker</text>
    <text x="710" y="224" font-size="12.5" fill="#475569">without asking for extra permissions.</text>
  </g>
  <g stroke="#64748B" stroke-width="2.5" fill="none">
    <path d="M314 178H356" marker-end="url(#ab)"/>
    <path d="M644 178H686" marker-end="url(#ab)"/>
  </g>

  <!-- Result -->
  <rect x="30" y="272" width="940" height="74" rx="12" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="50" y="296" font-size="11" font-weight="700" letter-spacing="1" fill="#64748B">RESULT ON EACH SERVER</text>
  <g font-size="12.5" fill="#166534">
    <text x="50" y="324">✓ Docker runs your apps</text>
    <text x="300" y="324">✓ Docker Compose runs several apps together</text>
    <text x="700" y="324">✓ Same setup on every server</text>
  </g>
</svg>
