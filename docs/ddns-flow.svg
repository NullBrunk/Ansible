<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 520" width="1000" height="520" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>ddns: each server tells a name directory its new address every time it starts</title>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <g id="i-server">
      <rect x="-12" y="-11" width="24" height="6" rx="1.5"/><rect x="-12" y="-3" width="24" height="6" rx="1.5"/><rect x="-12" y="5" width="24" height="6" rx="1.5"/>
    </g>
    <g id="i-search" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-3" cy="-3" r="8"/><path d="M3 3L11 11"/>
    </g>
    <g id="i-book" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-10" y="-12" width="20" height="24" rx="2"/><path d="M-5 -5H5M-5 0H5M-5 5H1"/>
    </g>
    <g id="i-laptop" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-13" y="-10" width="26" height="17" rx="2"/><path d="M-17 11H17"/>
    </g>
  </defs>

  <rect width="1000" height="520" rx="18" fill="#F8FAFC"/>

  <!-- Definition -->
  <rect x="30" y="24" width="940" height="42" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="500" y="50" text-anchor="middle" font-size="13.5" fill="#1E3A8A"><tspan font-weight="700">DDNS</tspan> = a name directory that keeps itself up to date</text>

  <!-- Steps -->
  <g>
    <rect x="30" y="86" width="280" height="160" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="68" cy="124" r="22" fill="#2563EB"/>
    <use xlink:href="#i-server" transform="translate(68,124)" fill="#FFFFFF"/>
    <text x="102" y="120" font-size="11" font-weight="700" fill="#64748B">STEP 1</text>
    <text x="102" y="138" font-size="14.5" font-weight="700" fill="#0F172A">A server starts</text>
    <text x="50" y="186" font-size="12.5" fill="#475569">Each time, the cloud gives it a</text>
    <text x="50" y="206" font-size="12.5" fill="#475569">new public address.</text>

    <rect x="360" y="86" width="280" height="160" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="398" cy="124" r="22" fill="#7C3AED"/>
    <use xlink:href="#i-search" transform="translate(398,124)" stroke="#FFFFFF" stroke-width="2.2"/>
    <text x="432" y="120" font-size="11" font-weight="700" fill="#64748B">STEP 2</text>
    <text x="432" y="138" font-size="14.5" font-weight="700" fill="#0F172A">It finds its address</text>
    <text x="380" y="186" font-size="12.5" fill="#475569">It asks the cloud: “what is my</text>
    <text x="380" y="206" font-size="12.5" fill="#475569">address right now?”</text>

    <rect x="690" y="86" width="280" height="160" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="728" cy="124" r="22" fill="#16A34A"/>
    <use xlink:href="#i-book" transform="translate(728,124)" stroke="#FFFFFF" stroke-width="2.2"/>
    <text x="762" y="120" font-size="11" font-weight="700" fill="#64748B">STEP 3</text>
    <text x="762" y="138" font-size="14.5" font-weight="700" fill="#0F172A">It tells the directory</text>
    <text x="710" y="186" font-size="12.5" fill="#475569">It registers its name and its new</text>
    <text x="710" y="206" font-size="12.5" fill="#475569">address in the name directory.</text>
  </g>
  <g stroke="#64748B" stroke-width="2.5" fill="none">
    <path d="M314 166H356" marker-end="url(#ab)"/>
    <path d="M644 166H686" marker-end="url(#ab)"/>
  </g>

  <!-- Result -->
  <rect x="30" y="268" width="940" height="222" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="50" y="294" font-size="11" font-weight="700" letter-spacing="1" fill="#64748B">THE RESULT, FOR EVERYONE ON THE INTERNAL NETWORK</text>

  <rect x="50" y="310" width="230" height="88" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
  <circle cx="86" cy="354" r="20" fill="#2563EB"/>
  <use xlink:href="#i-laptop" transform="translate(86,354) scale(0.85)" stroke="#FFFFFF" stroke-width="2"/>
  <text x="116" y="348" font-size="13.5" font-weight="700" fill="#0F172A">A colleague</text>
  <text x="116" y="368" font-size="11.5" fill="#64748B">types my-server.dev</text>

  <path d="M284 354H386" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
  <text x="335" y="344" text-anchor="middle" font-size="10.5" font-weight="700" fill="#475569">my-server.dev ?</text>

  <rect x="390" y="310" width="230" height="88" rx="12" fill="#F0FDF4" stroke="#BBF7D0"/>
  <circle cx="426" cy="354" r="20" fill="#16A34A"/>
  <use xlink:href="#i-book" transform="translate(426,354) scale(0.85)" stroke="#FFFFFF" stroke-width="2.2"/>
  <text x="456" y="348" font-size="13.5" font-weight="700" fill="#166534">Name directory</text>
  <text x="456" y="368" font-size="11.5" fill="#64748B">(the DDNS server)</text>

  <path d="M624 354H726" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
  <text x="675" y="344" text-anchor="middle" font-size="10.5" font-weight="700" fill="#475569">current address</text>

  <rect x="730" y="310" width="230" height="88" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
  <circle cx="766" cy="354" r="20" fill="#475569"/>
  <use xlink:href="#i-server" transform="translate(766,354) scale(0.85)" fill="#FFFFFF"/>
  <text x="796" y="348" font-size="13.5" font-weight="700" fill="#0F172A">Your server</text>
  <text x="796" y="368" font-size="11.5" fill="#64748B">at its current address</text>

  <text x="500" y="436" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">The name never changes, even though the address does.</text>
  <text x="500" y="460" text-anchor="middle" font-size="12.5" fill="#64748B">No manual update needed: it happens by itself every time a server starts.</text>
</svg>
